[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=68", "wheel" ]

[project]
name = "mcr-planner"
version = "0.1.0"
description = "A comprehensive task planning service using PyJobShop and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.109",
  "jinja2>=3.1.3",
  "mypy>=1.18.2",
  "pandas>=2.1",
  "psycopg2-binary>=2.9.9",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "pyjobshop>=0.0.7",
  "python-dateutil>=2.8.2",
  "python-dotenv>=1",
  "python-multipart>=0.0.6",
  "sqlalchemy>=2.0.44",
  "uvicorn[standard]>=0.27",
]

[dependency-groups]
dev = [
  "httpx>=0.26",
  "pre-commit>=4.3",
  "pytest>=8.4.2",
  "pytest-asyncio>=0.21",
  "pytest-cov>=7",
  "ruff>=0.14.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = [ "tests" ]
asyncio_mode = "auto"

[tool.mypy]
strict = true
ignore_missing_imports = true
explicit_package_bases = true
disallow_untyped_decorators = false
exclude = ".*/__init__\\.py$"
