[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcr_planner"
version = "0.1.0"
description = "A comprehensive task planning service using PyJobShop and PostgreSQL"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyjobshop>=1.0.0",
    "sqlalchemy>=2.0.44",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.2",
    "pandas>=2.1.0",
    "jinja2>=3.1.3",
    "python-multipart>=0.0.6",
    "mypy>=1.18.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.3",
    "httpx>=0.26.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
