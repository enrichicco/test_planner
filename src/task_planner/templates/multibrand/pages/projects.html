{% extends "base.html" %} {% block title %}Projects{% endblock %} {% block
content %}
<div class="page-container">
  <header class="page-header">
    <div>
      <h1 class="page-title">Projects</h1>
      <p class="text-gray-600">List and quick stats for projects</p>
    </div>
  </header>

  <div class="grid grid-cols-3 gap-6 mb-8">
    <div class="card">
      <div class="card-header"><h3 class="font-bold">Recent Projects</h3></div>
      <div class="card-body">
        <div
          hx-get="/api/v1/projects?limit=5"
          hx-trigger="load"
          hx-swap="innerHTML"
        >
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h2 class="font-bold">Project List</h2>
    </div>
    <div class="card-body">
      <div
        id="project-list"
        hx-get="/api/v1/projects?limit=1000"
        hx-trigger="load"
        hx-swap="innerHTML"
      >
        <div class="loading-spinner"></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
