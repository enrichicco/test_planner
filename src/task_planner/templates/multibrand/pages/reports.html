{% extends "multibrand/base.html" %} {% block title %}Reports{% endblock %} {%
block content %}
<div class="page-container">
  <header class="page-header">
    <div>
      <h1 class="page-title">Reports</h1>
      <p class="text-gray-600">Generate and view system reports</p>
    </div>
  </header>

  <div class="grid grid-cols-2 gap-6 mb-8">
    <div class="card">
      <div class="card-header"><h3 class="font-bold">Project Summary</h3></div>
      <div class="card-body">
        <div
          id="report-project-summary"
          hx-get="/api/v1/reports/projects/summary"
          hx-trigger="load"
          hx-swap="innerHTML"
        >
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3 class="font-bold">Task Summary</h3></div>
      <div class="card-body">
        <div
          id="report-task-summary"
          hx-get="/api/v1/reports/tasks/summary"
          hx-trigger="load"
          hx-swap="innerHTML"
        >
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3 class="font-bold">Resource Workload</h3>
      </div>
      <div class="card-body">
        <div
          id="report-resource-workload"
          hx-get="/api/v1/reports/resources/workload"
          hx-trigger="load"
          hx-swap="innerHTML"
        >
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><h3 class="font-bold">Assignments</h3></div>
      <div class="card-body">
        <div
          id="report-assignments"
          hx-get="/api/v1/reports/assignments"
          hx-trigger="load"
          hx-swap="innerHTML"
        >
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>

    <div class="card col-span-2">
      <div class="card-header"><h3 class="font-bold">Project Timeline</h3></div>
      <div class="card-body">
        <div
          id="report-project-timeline"
          hx-get="/api/v1/reports/projects/timeline"
          hx-trigger="load"
          hx-swap="innerHTML"
        >
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %} {% block extra_scripts %}
<script>
  document.body.addEventListener("htmx:afterSwap", function (event) {
    // Project Summary Report
    if (event.target.id === "report-project-summary") {
      try {
        const data = JSON.parse(event.detail.xhr.responseText);
        let html = '<div class="space-y-3">';
        for (const [key, value] of Object.entries(data)) {
          const label = key
            .replace(/_/g, " ")
            .replace(/\b\w/g, l => l.toUpperCase());
          html += `<div class="flex justify-between"><span class="text-gray-600">${label}:</span><span class="font-bold text-brand">${value}</span></div>`;
        }
        html += "</div>";
        event.target.innerHTML = html;
      } catch (e) {
        console.error("Error rendering project summary:", e);
      }
    }

    // Task Summary Report
    if (event.target.id === "report-task-summary") {
      try {
        const data = JSON.parse(event.detail.xhr.responseText);
        let html = '<div class="space-y-3">';
        for (const [key, value] of Object.entries(data)) {
          const label = key
            .replace(/_/g, " ")
            .replace(/\b\w/g, l => l.toUpperCase());
          html += `<div class="flex justify-between"><span class="text-gray-600">${label}:</span><span class="font-bold text-brand">${value}</span></div>`;
        }
        html += "</div>";
        event.target.innerHTML = html;
      } catch (e) {
        console.error("Error rendering task summary:", e);
      }
    }

    // Resource Workload Report
    if (event.target.id === "report-resource-workload") {
      try {
        const data = JSON.parse(event.detail.xhr.responseText);
        const items = Array.isArray(data) ? data : data.items || [];

        if (items.length === 0) {
          event.target.innerHTML =
            '<p class="text-gray-500">No resource workload data</p>';
          return;
        }

        let html = '<div class="space-y-2">';
        items.slice(0, 10).forEach(item => {
          const name = item.resource_name || item.name || "Unknown";
          const hours = item.total_hours || item.allocated_hours || 0;
          html += `
            <div class="p-2 border-b border-gray-100">
              <div class="flex justify-between items-center">
                <span class="font-medium">${name}</span>
                <span class="text-brand font-bold">${hours}h</span>
              </div>
            </div>
          `;
        });
        html += "</div>";
        event.target.innerHTML = html;
      } catch (e) {
        console.error("Error rendering resource workload:", e);
      }
    }

    // Assignments Report
    if (event.target.id === "report-assignments") {
      try {
        const data = JSON.parse(event.detail.xhr.responseText);
        const items = Array.isArray(data) ? data : data.items || [];

        if (items.length === 0) {
          event.target.innerHTML =
            '<p class="text-gray-500">No assignments data</p>';
          return;
        }

        let html = '<div class="space-y-2">';
        items.slice(0, 10).forEach(item => {
          const taskName = item.task_name || "Unknown Task";
          const resourceName = item.resource_name || "Unassigned";
          const status = item.status || "pending";
          const statusColors = {
            active: "text-success",
            pending: "text-warning",
            completed: "text-gray-500",
          };
          const statusClass = statusColors[status] || "text-gray-500";

          html += `
            <div class="p-2 border-b border-gray-100">
              <div class="flex justify-between items-center">
                <div>
                  <div class="font-medium">${taskName}</div>
                  <div class="text-sm text-gray-500">${resourceName}</div>
                </div>
                <span class="badge badge-sm ${statusClass}">${status}</span>
              </div>
            </div>
          `;
        });
        html += "</div>";
        event.target.innerHTML = html;
      } catch (e) {
        console.error("Error rendering assignments:", e);
      }
    }

    // Project Timeline Report
    if (event.target.id === "report-project-timeline") {
      try {
        const data = JSON.parse(event.detail.xhr.responseText);
        const items = Array.isArray(data) ? data : data.items || [];

        if (items.length === 0) {
          event.target.innerHTML =
            '<p class="text-gray-500">No timeline data</p>';
          return;
        }

        let html = '<div class="space-y-3">';
        items.forEach(item => {
          const name = item.project_name || item.name || "Unknown Project";
          const startDate = item.start_date
            ? new Date(item.start_date).toLocaleDateString()
            : "N/A";
          const endDate = item.end_date
            ? new Date(item.end_date).toLocaleDateString()
            : "N/A";
          const status = item.status || "unknown";

          html += `
            <div class="p-3 border border-gray-200 rounded">
              <div class="flex justify-between items-start mb-2">
                <h4 class="font-bold">${name}</h4>
                <span class="badge badge-sm">${status}</span>
              </div>
              <div class="text-sm text-gray-600">
                <span>${startDate}</span> → <span>${endDate}</span>
              </div>
            </div>
          `;
        });
        html += "</div>";
        event.target.innerHTML = html;
      } catch (e) {
        console.error("Error rendering project timeline:", e);
      }
    }
  });
</script>
{% endblock %}
