{% extends "multibrand/base.html" %} {% block title %}Tasks{% endblock %} {%
block content %}
<div class="page-container">
  <header class="page-header">
    <div>
      <h1 class="page-title">Tasks</h1>
      <p class="text-gray-600">Manage and track all your tasks</p>
    </div>
    <button class="btn btn-primary">+ New Task</button>
  </header>

  <!-- Filters -->
  <div class="card mb-6">
    <div class="card-body">
      <div class="flex gap-4 items-center flex-wrap">
        <div class="flex gap-2 items-center">
          <label class="text-sm font-medium text-gray-700">Stato:</label>
          <select
            id="task-status-filter"
            class="form-select"
            style="width: 200px"
          >
            <option value="">Tutti</option>
            <option value="1">Completato</option>
            <option value="2">???</option>
            <option value="3">Puntuale</option>
            <option value="4">Non specificato</option>
          </select>
        </div>
      </div>
    </div>
  </div>

  <div
    id="tasks-grid"
    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"
    hx-get="/api/v1/tasks?limit=1000"
    hx-trigger="load"
    hx-swap="innerHTML"
  >
    <div class="loading-spinner"></div>
  </div>
</div>
{% endblock %} {% block extra_scripts %}
<script>
  let allTasks = [];

  function renderTasks(tasks) {
    const grid = document.getElementById("tasks-grid");

    if (tasks.length === 0) {
      grid.innerHTML =
        '<div class="col-span-full text-center py-12"><p class="text-gray-500 text-lg">No tasks found</p></div>';
      return;
    }

    let html = "";
    tasks.forEach(task => {
      const statusColors = {
        pending: "bg-gray-400 text-white",
        in_progress: "bg-info text-white",
        completed: "bg-success text-white",
        blocked: "bg-danger text-white",
        cancelled: "bg-gray-500 text-white",
      };
      const statusClass =
        statusColors[task.status] || "bg-gray-300 text-gray-700";

      html += `
        <div class="card card-accent hover:shadow-lg transition-shadow" data-status="${
          task.status || ""
        }">
          <div class="card-header">
            <h3 class="text-lg font-bold text-gray-900">${
              task.name || task.description || "Untitled Task"
            }</h3>
            <span class="badge ${statusClass}">${
        task.status || "pending"
      }</span>
          </div>
          <div class="card-body">
            ${
              task.description && task.name !== task.description
                ? `<p class="text-gray-600 mb-4">${task.description}</p>`
                : ""
            }
            <div class="space-y-2 text-sm mb-4">
              ${
                task.estimated_hours
                  ? `<div class="flex justify-between"><span class="text-gray-500">Est. Hours:</span><span class="font-medium">${task.estimated_hours}h</span></div>`
                  : ""
              }
              ${
                task.actual_hours
                  ? `<div class="flex justify-between"><span class="text-gray-500">Actual Hours:</span><span class="font-medium">${task.actual_hours}h</span></div>`
                  : ""
              }
              ${
                task.deadline
                  ? `<div class="flex justify-between"><span class="text-gray-500">Deadline:</span><span class="font-medium">${new Date(
                      task.deadline
                    ).toLocaleDateString()}</span></div>`
                  : ""
              }
            </div>
            <div class="flex gap-2 pt-3 border-t border-gray-200">
              <button class="btn btn-sm btn-secondary flex-1" onclick="editTask(${
                task.task_id
              })">
                ✏️ Edit
              </button>
              <button class="btn btn-sm btn-danger" onclick="deleteTask(${
                task.task_id
              })">
                🗑️ Delete
              </button>
            </div>
          </div>
        </div>
      `;
    });

    grid.innerHTML = html;
  }

  function filterTasks() {
    const statusFilter = parseInt(
      document.getElementById("task-status-filter").value,
      10
    );

    let filtered = allTasks;
    if (statusFilter) {
      filtered = filtered.filter(t => t.task_status_id === statusFilter);
    }
    renderTasks(filtered);
  }

  document.body.addEventListener("htmx:afterSwap", function (event) {
    if (event.target.id === "tasks-grid") {
      try {
        const data = JSON.parse(event.detail.xhr.responseText);
        allTasks = Array.isArray(data) ? data : data.items || [];
        renderTasks(allTasks);
      } catch (e) {
        console.error("Error rendering tasks:", e);
        event.target.innerHTML =
          '<div class="col-span-full text-center py-12"><p class="text-red-500">Error loading tasks</p></div>';
      }
    }
  });

  document
    .getElementById("task-status-filter")
    ?.addEventListener("change", filterTasks);

  function editTask(id) {
    alert(`Edit task ${id} - Feature coming soon!`);
  }

  function deleteTask(id) {
    if (confirm(`Are you sure you want to delete task ${id}?`)) {
      alert(`Delete task ${id} - Feature coming soon!`);
    }
  }
</script>
{% endblock %}
